[package]
name = "keyos-passphrase"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = [".foundation-sdk"]

[dependencies]
log = "0.4"
getrandom = "0.2"
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = ".foundation-sdk/current/lib/keyos/sdk/crates/foundation-themes" }

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build" }

# Randomness is pre-wired: add `getrandom = "0.2"` (or `rand = "0.8"`) and calls
# route to the TRNG on device. Stay on the getrandom 0.2 line; 0.3+ is uncovered.
[patch.crates-io]
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }

# The Slint software renderer shipped in the SDK (1.17) has an off-by-one in Scene::next_line's skipped-lines
# branch: an item whose bottom edge equals the first line of a later dirty rectangle is kept for that line.
# It only trips a debug_assert (the simulator builds with debug assertions; device builds do not), so the
# simulator panics while the device would draw at most one stray line for one frame. Turn the assertions off
# for dependencies so the simulator behaves like the device build.
[profile.dev.package."*"]
debug-assertions = false
